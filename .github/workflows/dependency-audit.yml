name: Dependency Audit

# Keep workflow_dispatch available for current-head revalidation after CI repairs.
on:
  push:
    branches: [main]
    paths:
      - 'trace-cli/package.json'
      - 'trace-cli/bun.lock'
      - 'web-ui/package.json'
      - 'web-ui/pnpm-lock.yaml'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    # Short audit jobs fit comfortably in the slim container (1 CPU, 15-min cap).
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit web-ui dependency graph
        working-directory: web-ui
        shell: bash
        run: |
          # --prod: scope to production deps (matches what ships to users).
          # --lockfile-only: audit the committed pnpm-lock.yaml so the result
          #   reflects exactly what CI builds against, not a freshly re-resolved
          #   graph that may differ from the lockfile.
          # --ignore-registry-errors: keep the job green when the advisory
          #   registry is unreachable or times out on the slim runner.
          #   Dependabot and the override commits remain the source of truth
          #   for vulnerability tracking; a flaky advisory fetch must not block
          #   unrelated pushes.
          set -o pipefail
          pnpm audit --prod --lockfile-only --ignore-registry-errors --json \
            | tee pnpm-audit.json

  bun-trace-cli-audit:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Audit trace-cli Bun dependency graph
        working-directory: trace-cli
        shell: bash
        run: |
          set -euo pipefail

          # Bun uses exit 1 both for vulnerability findings and for registry
          # transport failures. Preserve real audit failures whenever Bun emits
          # valid JSON, but retry transient advisory-registry/network failures.
          # After bounded retries, a transport-only outage is an infrastructure
          # warning; Dependabot remains the independent vulnerability gate.
          for attempt in 1 2 3; do
            : > bun-audit.json
            : > bun-audit.stderr

            set +e
            bun audit --prod --json > bun-audit.json 2> bun-audit.stderr
            status=$?
            set -e

            if [ -s bun-audit.json ]; then
              cat bun-audit.json
            fi

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            # A valid JSON response with exit 1 is a real vulnerability report.
            if [ -s bun-audit.json ] && jq -e . bun-audit.json >/dev/null 2>&1; then
              cat bun-audit.stderr >&2
              echo '::error::Bun audit returned a valid vulnerability report.'
              exit "$status"
            fi

            if ! grep -Eqi '(^|[^0-9])5[0-9]{2}([^0-9]|$)|timeout|timed out|ECONNRESET|EAI_AGAIN|ENETUNREACH|registry.*(unavailable|error)' bun-audit.stderr; then
              cat bun-audit.stderr >&2
              exit "$status"
            fi

            cat bun-audit.stderr >&2
            if [ "$attempt" -lt 3 ]; then
              echo "Bun advisory registry unavailable (attempt $attempt/3); retrying."
              sleep $((attempt * 5))
            fi
          done

          echo '::warning::Bun advisory registry stayed unavailable after 3 attempts; transport failure is not treated as a vulnerability finding.'
