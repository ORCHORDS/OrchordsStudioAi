name: One-shot stale branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches with no commits ahead of main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}"
          page=1
          kept=()
          deleted=()

          while true; do
            branches="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/branches?per_page=100&page=${page}")"

            count="$(jq 'length' <<<"${branches}")"
            [[ "${count}" -eq 0 ]] && break

            while IFS= read -r branch; do
              [[ "${branch}" == "main" ]] && continue

              encoded_branch="$(jq -rn --arg v "${branch}" '$v|@uri')"
              comparison="$(curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/compare/main...${encoded_branch}")"
              ahead="$(jq -r '.ahead_by' <<<"${comparison}")"

              if [[ "${ahead}" -eq 0 ]]; then
                encoded_ref="$(jq -rn --arg v "heads/${branch}" '$v|@uri')"
                curl -fsSL -X DELETE \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${api}/git/refs/${encoded_ref}"
                echo "Deleted ${branch}"
                deleted+=("${branch}")
              else
                echo "KEEP ${branch}: ${ahead} commit(s) ahead of main"
                kept+=("${branch}:${ahead}")
              fi
            done < <(jq -r '.[].name' <<<"${branches}")

            page=$((page + 1))
          done

          echo "Deleted ${#deleted[@]} fully integrated branch(es)."
          if ((${#kept[@]})); then
            printf 'Unmerged branches retained:\n'
            printf ' - %s\n' "${kept[@]}"
            exit 1
          fi

          echo "Only main remains (apart from any branch created concurrently after enumeration)."
