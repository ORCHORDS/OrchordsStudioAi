name: Daily Build

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    # Single job on the dedicated runner: no job boundaries and no artifact
    # upload/download round-trips between build, attest and publish. Pinned to
    # the verification runner (b2) so nightly APK builds never claim the
    # CodeQL runner (a1) and evict its warm analysis workspace.
    runs-on: main-verification
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check for recent commits
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since="$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          response="$(curl --fail-with-body --silent --show-error \
            --get \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "since=$since" \
            --data-urlencode "per_page=1" \
            "https://api.github.com/repos/$REPOSITORY/commits")"
          count="$(printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(len(data) if isinstance(data, list) else 0)')"
          if [ "$count" -gt 0 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the past 24 hours, skipping build"
          fi

      - name: Checkout repository
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up build toolchain
        if: steps.check.outputs.should_build == 'true'
        uses: ./.github/actions/setup-build
        with:
          # APK publication does not build web-ui; keep the shared runner on
          # the Android/Gradle critical path only.
          web: false
          gradle: false

      - name: Select build mode
        if: steps.check.outputs.should_build == 'true'
        id: build_mode
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/debug" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are unavailable; producing an unsigned debug nightly artifact instead."
          fi

      - name: Prepare signing files
        if: steps.check.outputs.should_build == 'true' && steps.build_mode.outputs.signed == 'true'
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s' "$SIGNING_CONFIG" > local.properties

      - name: Gradle Build
        if: steps.check.outputs.should_build == 'true'
        env:
          GRADLE_TASK: ${{ steps.build_mode.outputs.gradle_task }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew "$GRADLE_TASK"

      - name: Remove signing files
        if: always() && steps.check.outputs.should_build == 'true'
        shell: bash
        run: rm -f app/app.key local.properties

      - name: Generate APK checksums
        if: steps.check.outputs.should_build == 'true'
        env:
          APK_DIR: ${{ steps.build_mode.outputs.apk_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$APK_DIR"
          sha256sum -- *.apk > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Stage APK artifact
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-apks
          path: |
            ${{ steps.build_mode.outputs.apk_dir }}/*.apk
            ${{ steps.build_mode.outputs.apk_dir }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Attest APK build provenance
        if: steps.check.outputs.should_build == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'app/build/outputs/apk/*/*.apk'

      - name: Publish nightly prerelease
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            Automated daily build (commit `${{ github.sha }}`).

            SHA-256 checksums are attached in `SHA256SUMS`.
            Build provenance is published as a GitHub artifact attestation.
            When repository signing secrets are unavailable, the workflow publishes an unsigned debug APK instead of failing.

            > Development build - may be unstable, for testing only.
          files: |
            app/build/outputs/apk/*/*.apk
            app/build/outputs/apk/*/SHA256SUMS
