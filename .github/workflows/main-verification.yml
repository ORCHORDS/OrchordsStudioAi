name: Main Verification

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
  cancel-in-progress: false

jobs:
  verify:
    name: Main Verification
    runs-on: main-verification
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          # Android/provider verification does not build web-ui. Avoid pnpm
          # verification/install work on the dedicated runner.
          web: false
          # The dedicated verification runner keeps a warm Gradle user home.
          # Avoid restoring a second Actions Gradle cache over it.
          gradle: false
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Verify app, providers, lint and debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew -PciVerify :app:testDebugUnitTest :app:lintDebug :ai:test :app:assembleDebug
