name: Main Verification

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
  cancel-in-progress: false

jobs:
  verify:
    name: Main Verification
    runs-on: main-verification
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Verify dedicated Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          java_bin="$(readlink -f "$(command -v java)")"
          java_version="$("$java_bin" -version 2>&1 | head -n1)"
          printf '%s\n' "$java_version"
          printf '%s\n' "$java_version" | grep -Eq 'version "21([.]|\")' || {
            echo "::error::Java 21 is required on the dedicated verification runner"
            exit 1
          }
          java_home="$(dirname "$(dirname "$java_bin")")"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"

      - name: Verify app, providers, lint and debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew -PciVerify :app:testDebugUnitTest :app:lintDebug :ai:test :app:assembleDebug
